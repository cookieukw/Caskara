import groovy.json.JsonSlurper
import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

def manifestFile = file('src/main/resources/manifest.json')
def manifest = new JsonSlurper().parseText(manifestFile.text)

version = manifest.Version
group = manifest.Group.toLowerCase() // Hytale uses lowercase groups by convention


ext {
    // Points to Hytale's UserData directory; deploy writes into its Mods subdirectory.
    def localProps = new Properties()
    def localPropsFile = project.rootProject.file('local.properties')
    if (localPropsFile.exists()) {
        localProps.load(localPropsFile.newDataInputStream())
    }
    
    hytaleHome = localProps.getProperty('hytale.dir') ?: 
                 (System.getProperty("os.name").toLowerCase().contains("win") 
                    ? "${System.getProperty("user.home")}/AppData/Roaming/Hytale"
                    : "${System.getProperty("user.home")}/.local/share/hytale")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

// Configuração para indexar pastas de assets extras no IDE e no JAR
sourceSets {
    main {
        resources {
            srcDirs += ['assets']
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.xerial:sqlite-jdbc:3.45.1.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.register('deploy') {
    dependsOn 'shadowJar'

    def jarFile = tasks.shadowJar.archiveFile
    def targetDir = file("${hytaleHome}/Mods")

    inputs.file(jarFile)
    outputs.upToDateWhen { false }

    doLast {
        if (!file(hytaleHome).exists()) {
            println "AVISO: Pasta do Hytale não encontrada em: $hytaleHome"
            println "Configure 'hytale.dir=/caminho/certo' no seu local.properties"
            return
        }

        targetDir.mkdirs()

        def source = jarFile.get().asFile
        def target = new File(targetDir, source.name)
        def temp = new File(targetDir, ".${source.name.replace('.jar', '')}.deploy.tmp")

        try {
            Files.copy(source.toPath(), temp.toPath(), StandardCopyOption.REPLACE_EXISTING)
            Files.move(
                temp.toPath(),
                target.toPath(),
                StandardCopyOption.REPLACE_EXISTING,
                StandardCopyOption.ATOMIC_MOVE
            )
            println "Deploy: ${target}"
        } catch (Exception e) {
            Files.deleteIfExists(temp.toPath())
            throw e
        }
    }
}

shadowJar {
    archiveFileName.set("Caskara-${project.version}.jar")
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()
}
// Deploy is opt-in: `./gradlew shadowJar -Pdeploy`, or just `./gradlew deploy`.
// It used to run after EVERY build, copying the jar into a local Hytale install —
// that breaks CI and any machine that doesn't have one.
if (project.hasProperty('deploy')) {
    tasks.shadowJar.finalizedBy('deploy')
}

tasks.jar {
    archiveClassifier.set('plain')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.resources
    destinationDirectory.set(file("$projectDir/build/libs"))
}
